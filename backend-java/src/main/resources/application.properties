spring.application.name=backend

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/filmplace}
spring.datasource.username=${DATABASE_USER:filmplace}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.config.import=optional:file:.env[.properties],optional:file:backend-java/.env[.properties]

filmplace.security.jwt.secret=${JWT_SECRET}
filmplace.security.jwt.expiration-ms=86400000
filmplace.cors-origin=${CORS_ORIGIN:http://localhost:4200}
filmplace.images-path=${IMAGES_PATH:images}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=40MB
server.compression.enabled=true
server.compression.min-response-size=1024
server.error.include-message=never
